<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Book</title>
</head>
<body>
    <h1>Add Book</h1>

    {% for error in errors %}
        <p style="color: red;">{{ error }}</p>
    {% endfor %}

    <form method="POST">
        <label for="book_id">Book ID:</label><br>
        <input id="book_id" type="number" name="book_id"
               min="1" max="2147483647" required>
        <br><br>

        <label for="title">Title:</label><br>
        <input id="title" type="text" name="title"
               maxlength="150" required>
        <br><br>

        <label for="price">Price:</label><br>
        <input id="price" type="number" name="price"
               min="0" max="99999999.99" step="0.01" required>
        <br><br>

        <label for="author_id">Author:</label><br>
        <select id="author_id" name="author_id" required>
            <option value="">Choose an author</option>

            {% for author in authors %}
                <option value="{{ author['author_id'] }}">
                    {{ author["author_id"] }} - {{ author["name"] }}
                </option>
            {% endfor %}
        </select>
        <br><br>

        <p><label>Publisher: <select name="publisher_id" required><option value="">Choose a publisher</option>
{% for item in publishers %}<option value="{{ item['publisher_id'] }}" {% if request.form.get('publisher_id','') == item['publisher_id']|string %}selected{% endif %}>{{ item['name'] }}</option>{% endfor %}</select></label></p><p><label>Category: <select name="category_id" required><option value="">Choose a category</option>
{% for item in categories %}<option value="{{ item['category_id'] }}" {% if request.form.get('category_id','') == item['category_id']|string %}selected{% endif %}>{{ item['name'] }}</option>{% endfor %}</select></label></p><p><label>Publication year: <input type="number" min="1" max="9999" name="publish_year" value="{{ request.form.get('publish_year','') }}"></label></p><button type="submit">Save Book</button>
    </form>

    <p><a href="/library">Back to Library</a></p>
</body>
</html>
